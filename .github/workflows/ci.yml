name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # torch >= 2.9 publishes wheels for CPython 3.10-3.14 only; 3.9 was
        # dropped after torch 2.8 and 3.8 after torch 2.4.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installed first, and from the CPU index, so the default PyPI wheels
      # (which bundle several GB of CUDA libraries the runner cannot use) are
      # never downloaded. The step below then sees torch/torchvision as
      # already satisfied.
      - name: Install CPU-only PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest tests/ -q
