[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-splines"
version = "1.0.0"
description = "Transform neural networks into interpretable mathematical curves using harmonic decomposition and spline interpolation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Robert Sitton", email = "rsitton@quholo.com"}
]
keywords = [
    "neural-networks", 
    "splines", 
    "model-compression", 
    "interpretable-ai",
    "harmonic-decomposition",
    "geometric-ml",
    "parameter-efficiency"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
# torch >= 2.9 publishes wheels for CPython 3.10+ only, so the previously
# declared ">=3.8" was not installable with the pinned torch floor.
requires-python = ">=3.10"
# Only torch and numpy are actually imported by this package. scipy,
# matplotlib, tqdm, safetensors, transformers, accelerate and huggingface-hub
# were previously declared here but appear in no import statement; they are
# moved to the extras that would need them if those features are implemented.
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0"
]

[project.optional-dependencies]
# neural_splines/core/train.py and inference.py import torchvision to fetch
# MNIST. It is not needed to import the library itself.
examples = [
    "torchvision>=0.15.0"
]
dev = [
    "torchvision>=0.15.0",
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.6.0",
    "isort>=5.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=2.13.0"
]
visualization = [
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "ipython>=7.25.0",
    "jupyter>=1.0.0"
]
# The `deepseek` extra is retained but currently has no consumer: the module
# it was added for (neural_splines.models.deepseek_neural) was never committed,
# and nothing in the package imports transformers, accelerate, huggingface-hub,
# safetensors, tokenizers or datasets. Installing it today pulls a large
# dependency tree that no code path uses.
deepseek = [
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "huggingface-hub>=0.16.0",
    "safetensors>=0.3.0",
    "tokenizers>=0.13.0",
    "datasets>=2.0.0"
]
full = [
    "neural-splines[dev,examples,visualization,deepseek]"
]

[project.urls]
Homepage = "https://github.com/anjaustin/neural_splines"
Repository = "https://github.com/anjaustin/neural_splines"
"Bug Tracker" = "https://github.com/anjaustin/neural_splines/issues"

# [project.scripts] intentionally omitted. It previously declared
# neural-splines, spline-convert and spline-visualize, all pointing at
# functions that only printed a "placeholder" line, so installing the package
# put three no-op commands on the user's PATH. The working entry points are
# the modules themselves:
#   python -m neural_splines.core.train
#   python -m neural_splines.core.inference
#   python -m neural_splines.core.dense_to_neural_spline
# Restore this table once cli.py / convert.py / visualization.py do something.

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_splines*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
neural_splines = [
    "data/*.json",
    "configs/*.yaml",
    "templates/*.jinja2"
]

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["neural_splines"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU"
]

# Coverage configuration
[tool.coverage.run]
source = ["neural_splines"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/cli.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

# MyPy type checking
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "numpy.*",
    "scipy.*",
    "matplotlib.*"
]
ignore_missing_imports = true
